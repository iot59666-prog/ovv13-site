# Render Blueprint: статический сайт ovv13 (без сборки)
services:
  - type: web
    name: ovv13
    runtime: static
    buildCommand: echo "static site, no build"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
